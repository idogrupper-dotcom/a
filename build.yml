name: Build mod jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # אם Loom מתלונן על גרסת Gradle, החלף כאן לגרסה שנדרשת
          gradle-version: 9.7.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-zoo-jar
          path: build/libs/tiktok-zoo-*[0-9].jar
